# Local development infrastructure only (PRD §16.1).
# Production infrastructure is Terraform/EKS and is NOT in scope until Phase 6.
services:
  postgres:
    image: postgres:15-alpine # PRD §16 Table 16.1 — PostgreSQL 15
    container_name: talentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentlens_dev}
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-talentlens}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine # PRD §16 Table 16.1 — Redis 7
    container_name: talentlens-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PRD §16.1 names localstack in the local compose file; PRD §16 Table 16.1
  # makes S3 the object store for resumes. Only the s3 service is enabled —
  # SQS arrives with BullMQ, and OpenSearch is not needed until Phase 3 search.
  localstack:
    image: localstack/localstack:3 # S3-compatible API for local development
    container_name: talentlens-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      # Buckets are created by Terraform in production; locally the init
      # script below stands in for that so the API never has to create one.
      RESUME_BUCKET: ${S3_BUCKET:-talentlens-resumes-dev}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3api head-bucket --bucket "$$RESUME_BUCKET" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  localstack_data:
